<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#159A55">
<title>Meu Plano · Emagrecimento</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone.svg">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app"></div>

<nav class="nav" id="nav" style="display:none">
  <button data-tela="inicio"      onclick="App.ir('inicio')">      <span class="ic">🏠</span><span class="lbl">Início</span></button>
  <button data-tela="alimentacao" onclick="App.ir('alimentacao')"> <span class="ic">🍽️</span><span class="lbl">Dieta</span></button>
  <button data-tela="treinos"     onclick="App.ir('treinos')">     <span class="ic">🏋️</span><span class="lbl">Treinos</span></button>
  <button data-tela="progresso"   onclick="App.ir('progresso')">   <span class="ic">📈</span><span class="lbl">Progresso</span></button>
  <button data-tela="metas"       onclick="App.ir('metas')">       <span class="ic">🎯</span><span class="lbl">Metas</span></button>
  <button data-tela="perfil"      onclick="App.ir('perfil')">      <span class="ic">👤</span><span class="lbl">Perfil</span></button>
</nav>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)App.fecharModal()">
  <div class="modal" id="modal"></div>
</div>

<div class="nivelup" id="nivelup"></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/backend.js"></script>
<script src="js/screens.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/app.js"></script>

</body>
</html>
