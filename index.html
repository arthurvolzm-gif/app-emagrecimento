<script>
/* ---------- SERVICE WORKER ----------
   E o que faz o app abrir sem internet. Sem ele a Play Store reprova
   (app que mostra erro de navegador offline) e o iPhone nao consegue
   receber notificacao nem instalado na tela de inicio.

   So registra em https (ou localhost, pra dar pra testar aqui). Em
   file:// o navegador bloqueia, e a gente abre o app assim pra testar,
   entao o if nao e paranoia. */
var LOCAL = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
if ('serviceWorker' in navigator && (location.protocol === 'https:' || LOCAL)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

/* ---------- ONDE O APP ESTA RODANDO ----------
   Marca no <html> se a pessoa abriu pelo app instalado (Play Store,
   tela de inicio do iPhone) ou pelo navegador. O CSS e o JS usam isso;
   em especial, dentro do app da Play Store nao pode aparecer link de
   pagamento externo — e regra do Google, nao gosto nosso. */
(function () {
  var doc = document.documentElement;
  var instalado = window.matchMedia('(display-mode: standalone)').matches
               || window.navigator.standalone === true;
  /* o app da Play Store e uma TWA: o Chrome entrega a pagina com este
     referrer, que navegador nenhum consegue forjar */
  var androidApp = document.referrer.indexOf('android-app://') === 0
                || new URLSearchParams(location.search).get('origem') === 'twa';
  if (androidApp) { try { sessionStorage.setItem('ff_twa', '1'); } catch (e) {} }
  try { androidApp = androidApp || sessionStorage.getItem('ff_twa') === '1'; } catch (e) {}

  doc.dataset.instalado = instalado ? 'sim' : 'nao';
  doc.dataset.loja = androidApp ? 'play' : 'nao';
  window.NO_APP_DA_LOJA = androidApp;
})();

/* ---------- VOLTA DO CHECKOUT DO MODO CORRIDA ----------
   Quem sai pra pagar e volta cai aqui. O webhook pode levar alguns
   segundos pra escrever o acesso, entao App.verificarCorrida tenta
   algumas vezes antes de desistir — sem barulho: se nao achar, a tela
   de venda continua como estava e a pessoa usa o "ja paguei". */
window.addEventListener('pageshow', function () {
  var corrida = false, reajuste = false, biblioteca = false, duo = false;
  try {
    corrida    = sessionStorage.getItem('ff_comprou_corrida')    === '1';
    reajuste   = sessionStorage.getItem('ff_comprou_reajuste')   === '1';
    biblioteca = sessionStorage.getItem('ff_comprou_biblioteca') === '1';
    duo        = sessionStorage.getItem('ff_comprou_duo')        === '1';
  } catch (e) {}
  if (!corrida && !reajuste && !biblioteca && !duo) return;
  try {
    sessionStorage.removeItem('ff_comprou_corrida');
    sessionStorage.removeItem('ff_comprou_reajuste');
    sessionStorage.removeItem('ff_comprou_biblioteca');
    sessionStorage.removeItem('ff_comprou_duo');
  } catch (e) {}
  setTimeout(function () {
    if (!window.App) return;
    if (corrida    && App.verificarCorrida)    App.verificarCorrida(true);
    if (reajuste   && App.verificarReajuste)   App.verificarReajuste(true);
    if (biblioteca && App.verificarBiblioteca) App.verificarBiblioteca(true);
    if (duo        && App.verificarDuo)        App.verificarDuo(true);
  }, 1200);
});
</script>

</body>
</html>
