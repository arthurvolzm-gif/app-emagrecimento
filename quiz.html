<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meu Plano — Descubra o seu Índice de Constância</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   Mesma paleta do app: branco + verde médio.
   A pessoa sai do anúncio, faz o quiz e entra no app sem
   sentir que trocou de produto.
   ========================================================= */
:root{
  --verde:#159A55;
  --verde-esc:#0E7A42;
  --verde-claro:#3FBE7C;
  --verde-tint:#E8F6EE;
  --verde-tint2:#F1FAF5;
  --ambar:#F0A500;
  --ambar-tint:#FFF6E0;
  --vermelho:#E05A4E;
  --vermelho-tint:#FDECEC;
  --azul-tint:#EAF2FA;
  --tinta:#0F1C17;
  --tinta-2:#3C4B44;
  --cinza:#6B7C74;
  --cinza-c:#9CAAA3;
  --linha:#E6EDE9;
  --fundo:#FBFCFB;
  --branco:#FFFFFF;
  --r:18px;
  --sombra:0 1px 2px rgba(15,28,23,.04), 0 8px 24px rgba(15,28,23,.06);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:'Manrope',-apple-system,sans-serif;
  background:var(--fundo);color:var(--tinta);
  font-size:15px;line-height:1.55;min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0 0 auto 0;height:340px;
  background:radial-gradient(120% 100% at 50% 0%, rgba(21,154,85,.10) 0%, rgba(21,154,85,0) 70%);
  pointer-events:none;z-index:0;
}
h1,h2,h3,h4,.display{font-family:'Bricolage Grotesque','Manrope',sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.15;}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input{font-family:inherit;font-size:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;}

.wrap{max-width:560px;margin:0 auto;padding:22px 18px 60px;position:relative;z-index:1;}
.card-quiz{background:var(--branco);border-radius:24px;box-shadow:var(--sombra);border:1px solid var(--linha);padding:30px 24px;position:relative;}

.back-btn{position:absolute;left:12px;top:12px;color:var(--cinza-c);font-size:22px;line-height:1;padding:6px 10px;z-index:5;transition:color .16s;}
.back-btn:hover{color:var(--verde);}

.brand{text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800;color:var(--verde-esc);letter-spacing:-.01em;}
.brand-sub{font-size:11px;color:var(--cinza-c);text-align:center;margin-top:2px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}

/* ===== PROGRESSO ===== */
.progress-bar{height:7px;background:var(--linha);border-radius:20px;overflow:hidden;margin:16px 0 24px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--verde-esc),var(--verde-claro));border-radius:20px;transition:width .5s ease;}

/* ===== PILLS (respostas já dadas) ===== */
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.pill{background:var(--verde-tint2);border:1px solid var(--verde-tint);color:var(--verde-esc);font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:20px;}

.q-title{font-size:24px;font-weight:800;color:var(--tinta);line-height:1.22;margin-bottom:20px;text-align:center;}
.q-title.tight{margin-bottom:10px;}
.q-sub{font-size:13px;color:var(--cinza);text-align:center;margin:-12px 0 18px;font-weight:600;}
.echo{font-size:13px;color:var(--cinza);margin-bottom:8px;text-align:center;font-weight:600;}

/* ===== OPÇÕES ===== */
.opts{display:flex;flex-direction:column;gap:10px;}
.opts.compact{gap:8px;}
.opts.compact .opt{padding:13px 15px;font-size:14px;}
.opt{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--branco);border:1.5px solid var(--linha);border-radius:15px;
  padding:16px 17px;font-size:14.5px;font-weight:700;color:var(--tinta);
  transition:all .16s ease;
}
.opt:hover{border-color:var(--verde-claro);box-shadow:0 6px 18px rgba(21,154,85,.10);transform:translateY(-1px);}
.opt-radio{width:23px;height:23px;border-radius:50%;border:2px solid #CDDDD4;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .16s;}
.opt.sel{border-color:var(--verde);background:var(--verde-tint2);}
.opt.sel .opt-radio{border-color:var(--verde);background:var(--verde);}
.opt.sel .opt-radio::after{content:'✓';color:#fff;font-size:12px;font-weight:900;}
.opt-sub{display:block;font-size:12px;color:var(--cinza);font-weight:600;margin-top:2px;line-height:1.4;}

/* grade de 2 na abertura, foto colada ao botão */
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.sexo-card{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;box-shadow:0 8px 22px rgba(21,154,85,.20);transition:all .18s;cursor:pointer;}
.sexo-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(21,154,85,.30);}
.sexo-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--verde-tint);}
.sexo-emoji{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(150deg,var(--verde-tint),var(--verde-tint2));}
.opts.grid2 .opt{
  justify-content:center;text-align:center;gap:9px;border-radius:0;padding:15px 12px;font-size:15px;font-weight:800;
  background:linear-gradient(135deg,var(--verde-esc),var(--verde));color:#fff;border-color:transparent;
}
.opts.grid2 .opt:hover{transform:none;box-shadow:none;}
.opts.grid2 .opt-radio{width:19px;height:19px;border-color:rgba(255,255,255,.85);background:rgba(255,255,255,.16);}
.opts.grid2 .opt.sel{background:linear-gradient(135deg,#0B5F33,var(--verde-esc));}
.opts.grid2 .opt.sel .opt-radio{border-color:#fff;background:#fff;}
.opts.grid2 .opt.sel .opt-radio::after{color:var(--verde-esc);font-size:11px;}

/* ===== BOTÕES ===== */
.btn{
  display:block;width:100%;text-align:center;
  background:linear-gradient(135deg,var(--verde-esc),var(--verde));
  color:#fff;font-size:16px;font-weight:800;letter-spacing:-.01em;
  border-radius:16px;padding:17px 24px;
  box-shadow:0 8px 24px rgba(21,154,85,.28);transition:transform .16s,box-shadow .16s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(21,154,85,.38);}
.btn:active{transform:translateY(0);}
.btn.sec{background:var(--branco);color:var(--tinta);border:1.5px solid var(--linha);box-shadow:none;margin-top:10px;}

/* ===== INPUT ===== */
.text-input{
  width:100%;border:1.5px solid var(--linha);border-radius:15px;padding:16px 17px;
  font-size:16px;background:var(--branco);margin-bottom:13px;outline:none;font-weight:700;
  transition:border-color .16s,box-shadow .16s;
}
.text-input:focus{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-tint);}
.text-input::placeholder{color:var(--cinza-c);font-weight:600;}

/* ===== RÉGUA ===== */
.ruler-val{font-family:'Bricolage Grotesque',sans-serif;font-size:46px;font-weight:800;color:var(--verde-esc);margin:14px 0 4px;line-height:1;letter-spacing:-.03em;}
.ruler-val small{font-size:19px;color:var(--verde);margin-left:3px;font-weight:800;}
.ruler-track{position:relative;height:52px;margin:6px 6px 0;}
.ruler-line{position:absolute;left:0;right:0;bottom:16px;height:2px;background:var(--linha);}
.ruler-ticks{position:absolute;left:0;right:0;bottom:16px;height:26px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;}
.ruler-ticks .tk{width:1px;height:11px;background:#CDDDD4;}
.ruler-ticks .tk.maj{height:22px;width:2px;background:#9BB3A8;}
.ruler-pointer{position:absolute;top:0;bottom:16px;width:3px;background:var(--verde);transform:translateX(-50%);pointer-events:none;border-radius:2px;transition:left .05s linear;}
.ruler-pointer::after{content:'';position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--verde);}
.ruler-input{position:absolute;left:0;right:0;top:0;width:100%;height:100%;margin:0;opacity:0;cursor:grab;z-index:5;-webkit-appearance:none;appearance:none;background:transparent;}
.ruler-input::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:52px;background:transparent;cursor:grab;}
.ruler-input::-moz-range-thumb{width:40px;height:52px;border:none;background:transparent;cursor:grab;}
.ruler-labels{display:flex;justify-content:space-between;font-size:12.5px;color:var(--cinza-c);font-weight:800;margin-top:6px;}

/* ===== INTRO ===== */
.intro-badge{display:inline-block;background:var(--verde-tint);color:var(--verde-esc);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:7px 16px;border-radius:20px;margin-bottom:18px;}
.intro-h1{font-size:30px;font-weight:800;color:var(--tinta);line-height:1.18;margin-bottom:12px;text-align:center;}
.intro-h1 span{color:var(--verde);}
.intro-sub{font-size:15.5px;color:var(--cinza);text-align:center;line-height:1.6;margin-bottom:24px;font-weight:600;}
.intro-hint{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--cinza-c);margin:14px 0 18px;text-align:center;}

/* ===== ANALISANDO ===== */
.analise-title{text-align:center;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--verde-esc);margin-bottom:24px;}
.analise-list{display:flex;flex-direction:column;gap:15px;}
.analise-item{display:flex;align-items:center;gap:13px;font-size:14.5px;color:var(--cinza-c);font-weight:700;opacity:.45;transition:all .4s ease;}
.analise-item .ic{width:27px;height:27px;border-radius:50%;border:2px solid var(--linha);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;}
.analise-item.done{opacity:1;color:var(--tinta);}
.analise-item.done .ic{background:var(--verde);border-color:var(--verde);color:#fff;}

/* ===== DIAGNÓSTICO ===== */
.diag-tag{display:block;width:max-content;margin:0 auto 14px;background:var(--verde-esc);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 15px;border-radius:20px;}
.gauge{position:relative;width:190px;height:190px;margin:6px auto 4px;}
.gauge svg{transform:rotate(-90deg);}
.gauge .trilho{fill:none;stroke:var(--linha);stroke-width:14;}
.gauge .arco{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.7,.3,1);}
.gauge-centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge-num{font-family:'Bricolage Grotesque',sans-serif;font-size:52px;font-weight:800;line-height:1;letter-spacing:-.04em;}
.gauge-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--cinza-c);margin-top:5px;}
.faixa{text-align:center;font-size:20px;font-weight:800;margin:2px 0 6px;font-family:'Bricolage Grotesque',sans-serif;}
.faixa-sub{text-align:center;font-size:13.5px;color:var(--cinza);font-weight:600;line-height:1.6;margin-bottom:22px;}

.alerta{background:var(--vermelho-tint);border:1px solid #F6D3D0;border-radius:15px;padding:15px 17px;margin-bottom:18px;}
.alerta .t{font-size:14.5px;font-weight:800;color:#A03A32;line-height:1.4;}
.alerta .s{font-size:13px;color:#8A4A44;margin-top:5px;line-height:1.6;font-weight:600;}

.ponto{border:1.5px solid var(--verde-tint);background:var(--verde-tint2);border-radius:16px;padding:17px 18px;margin-bottom:12px;}
.ponto .n{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--verde-esc);margin-bottom:7px;}
.ponto p{font-size:14px;color:var(--tinta-2);line-height:1.65;font-weight:600;}
.ponto p b{color:var(--verde-esc);font-weight:800;}
.ponto p + p{margin-top:9px;}

.numeros{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
.num-box{background:var(--branco);border:1.5px solid var(--linha);border-radius:15px;padding:15px 14px;text-align:center;}
.num-box .v{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;color:var(--verde-esc);line-height:1;letter-spacing:-.03em;}
.num-box .v small{font-size:13px;color:var(--verde);margin-left:2px;}
.num-box .l{font-size:11px;color:var(--cinza);font-weight:700;margin-top:6px;line-height:1.35;}

/* ===== MINI-VSL ===== */
.vsl-tag{display:block;width:max-content;margin:0 auto 14px;background:var(--ambar-tint);color:#8A6100;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 15px;border-radius:20px;}
.vsl-ask{font-size:22px;font-weight:800;color:var(--tinta);text-align:center;line-height:1.25;margin-bottom:6px;}
.vsl-ask span{color:var(--verde);}
.vsl-quem{text-align:center;font-size:13px;color:var(--cinza);font-weight:600;margin-bottom:18px;}
.video-box{
  position:relative;border-radius:18px;overflow:hidden;margin-bottom:16px;
  background:linear-gradient(150deg,var(--verde-tint),var(--verde-tint2));
  border:1.5px solid var(--verde-tint);aspect-ratio:16/9;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;
}
.video-box .play{width:62px;height:62px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px;box-shadow:0 10px 28px rgba(21,154,85,.38);animation:pulse 2.2s ease-in-out infinite;}
.video-box .vlabel{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--verde-esc);}
.video-box .vname{font-size:15px;font-weight:800;color:var(--tinta);margin-top:5px;font-family:'Bricolage Grotesque',sans-serif;}
.video-box .vhint{font-size:11px;color:var(--cinza-c);margin-top:7px;font-weight:600;}
@keyframes pulse{0%,100%{box-shadow:0 10px 28px rgba(21,154,85,.34);}50%{box-shadow:0 14px 40px rgba(21,154,85,.55);}}

.roteiro{background:var(--branco);border:1.5px solid var(--linha);border-radius:16px;padding:19px;margin-bottom:18px;}
.roteiro h4{font-size:11px;color:var(--verde-esc);margin-bottom:11px;letter-spacing:.1em;font-weight:800;text-transform:uppercase;}
.roteiro p{font-size:14px;color:var(--tinta-2);line-height:1.7;margin-bottom:11px;font-weight:600;}
.roteiro p:last-child{margin-bottom:0;}
.roteiro strong{color:var(--verde-esc);font-weight:800;}

/* ===== OFERTA ===== */
.oferta{max-width:600px;margin:0 auto;padding:0 0 40px;}
.of-sec{padding:0 4px;margin-bottom:26px;}
.of-h{font-size:25px;font-weight:800;text-align:center;line-height:1.2;margin-bottom:8px;}
.of-h span{color:var(--verde);}
.of-sub{text-align:center;font-size:14px;color:var(--cinza);margin-bottom:20px;font-weight:600;line-height:1.6;}
.secao-tt{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza);margin:28px 0 12px;text-align:center;}

.lista-check{display:flex;flex-direction:column;gap:10px;}
.item-check{display:flex;gap:11px;align-items:flex-start;background:var(--branco);border:1.5px solid var(--linha);border-radius:15px;padding:14px 16px;}
.item-check .ic{width:24px;height:24px;border-radius:8px;background:var(--verde-tint);color:var(--verde-esc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;margin-top:1px;}
.item-check .t{font-size:14px;font-weight:800;line-height:1.35;}
.item-check .s{font-size:12.5px;color:var(--cinza);font-weight:600;margin-top:3px;line-height:1.5;}

.price-box{background:linear-gradient(150deg,var(--verde-esc),var(--verde));border-radius:22px;padding:28px 24px;text-align:center;color:#fff;margin-bottom:16px;box-shadow:0 14px 38px rgba(21,154,85,.30);}
.price-box .label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.86;}
.price-box .de{font-size:14px;opacity:.78;text-decoration:line-through;margin-top:8px;}
.price-box .val{font-family:'Bricolage Grotesque',sans-serif;font-size:54px;font-weight:800;line-height:1;margin:4px 0;letter-spacing:-.04em;}
.price-box .val sup{font-size:22px;top:-16px;position:relative;}
.price-box .por{font-size:13.5px;opacity:.9;font-weight:700;}
.price-box .off{display:inline-block;background:rgba(255,255,255,.18);font-size:11.5px;font-weight:800;padding:5px 14px;border-radius:20px;margin-top:12px;letter-spacing:.04em;}
.price-just{font-size:12.5px;color:var(--cinza);line-height:1.6;text-align:center;margin:14px 0 0;font-weight:600;}
.price-just b{color:var(--verde-esc);}

.garantia{background:var(--ambar-tint);border:1.5px solid #F0DFB4;border-radius:18px;padding:20px;text-align:center;}
.garantia .em{font-size:36px;}
.garantia h4{font-size:17px;margin:8px 0 7px;}
.garantia p{font-size:13.5px;color:#7A5A00;line-height:1.65;font-weight:600;}

.faq-item{background:var(--branco);border:1.5px solid var(--linha);border-radius:15px;padding:0;margin-bottom:9px;overflow:hidden;}
.faq-q{width:100%;text-align:left;padding:16px 17px;font-size:14px;font-weight:800;display:flex;gap:12px;align-items:center;line-height:1.4;}
.faq-q .sinal{margin-left:auto;color:var(--verde);font-size:19px;flex-shrink:0;transition:transform .2s;}
.faq-item.on .faq-q .sinal{transform:rotate(45deg);}
.faq-a{padding:0 17px;max-height:0;overflow:hidden;transition:max-height .28s ease,padding .28s ease;}
.faq-item.on .faq-a{padding:0 17px 16px;max-height:420px;}
.faq-a p{font-size:13.5px;color:var(--tinta-2);line-height:1.7;font-weight:600;}

.rodape{text-align:center;font-size:11.5px;color:var(--cinza-c);line-height:1.7;font-weight:600;padding:26px 10px 0;}

.fade{animation:fade .38s ease;}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:400px){
  .intro-h1{font-size:26px;}
  .q-title{font-size:21px;}
  .numeros{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   CONFIGURAÇÃO — é aqui que você mexe
   ========================================================= */

/* O expert do funil. Aparece nas duas mini-VSLs e na oferta.
   Trocar aqui muda em todos os lugares de uma vez. */
const EXPERT = {
  nome: 'Nome do Expert',
  credencial: 'Nutricionista · CRN 00000',
  foto: 'expert.jpg',                    // some sozinha se o arquivo não existir
  tempo: '9 anos acompanhando emagrecimento'
};

const PRODUTO = {
  nome: 'Meu Plano',
  mecanismo: 'Método da Constância',     // o nome do mecanismo (ver seção de mecanismo)
  indice: 'Índice de Constância'
};

/* PREÇO E CHECKOUT — trocar antes de publicar */

/* =========================================================
   RASTREIO — mesmo padrão do outro quiz:
   cada tela e cada resposta vão para o GA4 e para o Pixel
   ========================================================= */
function px(evento, padrao){
  if(typeof fbq !== 'function') return;
  try { padrao ? fbq('track', evento) : fbq('trackCustom', evento); } catch(e){}
}
function track(evento, params){
  if(typeof gtag === 'function'){ try { gtag('event', evento, params||{}); } catch(e){} }
  px(evento);
}
const track_estado = { etapa:0, rotulo:'intro', respondidas:0 };

function trackEtapa(step){
  track_estado.etapa++;
  const rotulo = step.type === 'question'
    ? `${step.q.num}. ${step.q.id}`
    : step.type + (step.full ? '_completo' : '') + (step.v2 ? '_2' : '');
  track_estado.rotulo = rotulo;
  track('quiz_etapa', { etapa: rotulo, etapa_id: step.q ? step.q.id : step.type, tipo: step.type, posicao: track_estado.etapa });
}
function trackResposta(qid, valor){
  track_estado.respondidas++;
  /* no nome não grava o que foi digitado, só que preencheu */
  const v = Array.isArray(valor) ? valor.join(' | ') : String(valor);
  track('quiz_resposta', { pergunta: qid, resposta: qid === 'nome' ? 'preenchido' : v });
}
window.addEventListener('pagehide', () => {
  track('quiz_abandono', { etapa: track_estado.rotulo, respondidas: track_estado.respondidas });
});

function esc(s){ return (s||'').replace(/"/g,'&quot;'); }
function backBtn(){ return state.idx > 0 ? `<button class="back-btn" onclick="go(-1)" aria-label="Voltar">←</button>` : ''; }
function nomeDe(){ const n = state.answers.nome; return n && n !== 'você' ? n : ''; }
function num(id){ return parseFloat(String(state.answers[id]||'').replace(/[^\d.]/g,'')) || 0; }

function cabecalho(pct){
  return `${backBtn()}
    <div class="brand">${PRODUTO.nome}</div>
    <div class="brand-sub">Diagnóstico gratuito</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
}

function pillsHTML(uptoNum){
  const done = QUESTIONS.filter(q => q.num < uptoNum && state.answers[q.id] && !q.noPill);
  if(!done.length) return '';
  return `<div class="pills">${done.slice(-3).map(q => `<span class="pill">${state.answers[q.id]}</span>`).join('')}</div>`;
}

function render(){
  const step = FLOW[state.idx];
  const map = {
    intro: renderIntro,
    question: () => renderQuestion(step.q),
    analyzing: renderAnalyzing,
    diagnostico: () => renderDiagnostico(step.full),
    vsl: () => renderVSL(step.n),
    oferta: renderOferta
  };
  (map[step.type] || renderIntro)();
  trackEtapa(step);
}

  const btn = app.querySelector(`.opt[data-i="${i}"]`);
  if(btn) btn.classList.toggle('sel');
}

function renderTextQuestion(q){

function renderRulerQuestion(q){
  const u = q.units[0];
  /* a meta de peso começa perto do peso informado, não no padrão fixo */
  const inicial = q.id === 'meta_peso' && num('peso')
    ? Math.max(u.min, Math.round(num('peso') * 0.88))
    : (state.answers[q.id] ? num(q.id) : u.def);
  app.innerHTML = `
  <div class="wrap fade">
    <div class="card-quiz" style="text-align:center">
      ${cabecalho((q.num/TOTAL_Q)*100)}
      <h2 class="q-title">${typeof q.question === 'function' ? q.question(state.answers) : q.question}</h2>
      <p class="q-sub">Arraste para ajustar</p>
      <div class="ruler-val"><span id="rVal">${inicial}</span><small>${u.u}</small></div>
      <div class="ruler-track">
        <div class="ruler-line"></div>
        <div class="ruler-ticks" id="rTicks"></div>
        <div class="ruler-pointer" id="rPointer"></div>
        <input type="range" class="ruler-input" id="rRange" min="${u.min}" max="${u.max}" step="${u.step}" value="${inicial}">
      </div>
      <div class="ruler-labels"><span>${u.min}</span><span>${Math.round((u.min+u.max)/2)}</span><span>${u.max}</span></div>
      <button class="btn" id="rNext" style="margin-top:22px">Continuar →</button>
    </div>
  </div>`;
  const range = document.getElementById('rRange');
  const val   = document.getElementById('rVal');
  const ponta = document.getElementById('rPointer');
  let ticks = ''; for(let i=0;i<=40;i++) ticks += `<span class="tk${i%5===0?' maj':''}"></span>`;
  document.getElementById('rTicks').innerHTML = ticks;
  function atualizar(){
    const v = parseFloat(range.value);
    val.textContent = Math.round(v);
    ponta.style.left = (((v-u.min)/(u.max-u.min))*100) + '%';
  }
  range.addEventListener('input', atualizar);
  atualizar();
  document.getElementById('rNext').onclick = () => {
    state.answers[q.id] = Math.round(parseFloat(range.value)) + ' ' + u.u;
    trackResposta(q.id, state.answers[q.id]);
    go(1);
  };
}

/* =========================================================
   CÁLCULOS
   As metas usam exatamente as mesmas fórmulas do app
   (js/store.js). Se mudar lá, muda aqui também, senão o
   número do quiz não bate com o que a pessoa vê no app.
   ========================================================= */
function objetivoId(){
  const i = state.answers.objetivo_i;
  return i === 1 ? 'hipertrofia' : i === 2 ? 'manutencao' : 'emagrecimento';
}
function localId(){ return state.answers.local_i === 1 ? 'casa' : 'academia'; }

function metaKcal(){
  const peso = num('peso'), altura = num('altura'), idade = num('idade');
  if(!peso || !altura || !idade) return 0;
  const base = 10*peso + 6.25*altura - 5*idade;
  const tmb  = state.answers.sexo === 'masculino' ? base + 5 : base - 161;
  const obj  = objetivoId();
  const fator = obj === 'emagrecimento' ? 0.80 : obj === 'hipertrofia' ? 1.12 : 1.00;
  return Math.round(tmb * 1.45 * fator / 10) * 10;
}
function metaAgua(){
  const bruto = num('peso') * 35;
  return Math.max(1500, Math.min(4500, Math.round(bruto/500)*500));
}
function metaProt(){
  const obj = objetivoId();
  const gkg = obj === 'emagrecimento' ? 2.0 : obj === 'hipertrofia' ? 1.8 : 1.6;
  return Math.round(num('peso') * gkg);
}
function imc(){
  const p = num('peso'), a = num('altura')/100;
  return a ? +(p/(a*a)).toFixed(1) : 0;
}
function difPeso(){ return +(num('peso') - num('meta_peso')).toFixed(1); }

/* ---------------------------------------------------------
   ÍNDICE DE CONSTÂNCIA (0 a 100)
   Não é exame nem promessa: é a soma do que a própria pessoa
   respondeu sobre a rotina dela. Por isso é honesto mostrar.
   Cada bloco vale o quanto pesa no resultado do dia a dia.
   --------------------------------------------------------- */
const PESOS_INDICE = {
  frequencia: [0, 8, 18, 25],       /* nenhuma / 1-2 / 3-4 / 5+        (25) */
  refeicoes:  [0, 6, 14, 20],       /* sem rotina / desanda / mais ou menos / organizada (20) */
  sono:       [0, 5, 15, 13],       /* <5 / 5-6 / 7-8 / >8             (15) */
  proteina:   [0, 5, 10],           /* não faz ideia / no olho / conta (10) */
  agua:       [0, 6, 10],           /* <1L / 1-2L / >2L                (10) */
  tentativas: [0, 4, 8, 10]         /* perdi a conta / 3-4 / 1-2 / primeira (10) */
};
const INDICE_MAX = 90;

function calcIndice(){
  let soma = 0;
  for(const id in PESOS_INDICE){
    const i = state.answers[id + '_i'];
    if(typeof i === 'number') soma += (PESOS_INDICE[id][i] || 0);
  }
  return Math.round((soma / INDICE_MAX) * 100);
}

function faixaIndice(v){
  if(v < 35) return { nome:'Muito baixa', cor:'#E05A4E',
    txt:'A sua rotina hoje não sustenta um resultado, por mais vontade que você tenha.' };
  if(v < 60) return { nome:'Baixa', cor:'#F0A500',
    txt:'Você acerta em alguns dias e perde em outros. É isso que apaga o progresso da semana.' };
  if(v < 80) return { nome:'Média', cor:'#3B82C4',
    txt:'Você já faz bastante coisa certa. O que falta é ela acontecer todo dia, não só nos dias bons.' };
  return { nome:'Alta', cor:'#159A55',
    txt:'A sua base já é boa. O que falta é organização e acompanhamento para o esforço virar resultado.' };
}

/* o ponto fraco que mais pesa hoje — usado na personalização */
function elosFracos(){
  const rot = {
    frequencia:'treino', refeicoes:'alimentação', sono:'sono',
    proteina:'proteína', agua:'água', tentativas:'constância'
  };
  return Object.keys(PESOS_INDICE).map(id => {
    const i = state.answers[id + '_i'];
    const max = Math.max(...PESOS_INDICE[id]);
    const val = typeof i === 'number' ? (PESOS_INDICE[id][i] || 0) : 0;
    return { id, rotulo: rot[id], perdido: max - val };
  }).sort((a,b) => b.perdido - a.perdido);
}

   ANALISANDO
   ========================================================= */
const PASSOS_ANALISE = [
  'Lendo as suas respostas',
  'Calculando a sua meta de calorias',
  'Medindo o seu ' + PRODUTO.indice,
  'Montando o seu plano de treino',
  'Liberando o seu diagnóstico'
];

function renderAnalyzing(){
  app.innerHTML = `
  <div class="wrap fade">
    <div class="card-quiz" style="padding-top:38px;padding-bottom:38px">
      <div class="analise-title">Analisando as suas respostas</div>
      <div class="progress-bar"><div class="progress-fill" id="anProg" style="width:0%"></div></div>
      <div class="analise-list">
        ${PASSOS_ANALISE.map((p,i)=>`<div class="analise-item" id="an${i}"><span class="ic">${i+1}</span><span>${p}</span></div>`).join('')}
      </div>
    </div>
  </div>`;

  const DUR = 5000;
  const barra = document.getElementById('anProg');
  const inicio = performance.now();
  /* smootherstep: começa devagar, acelera no meio, freia no fim */
  const suave = t => t*t*t*(t*(t*6-15)+10);

  function passo(agora){
    const t = Math.min(1, (agora - inicio) / DUR);
    barra.style.width = (suave(t) * 100) + '%';
    const feitos = Math.floor(suave(t) * PASSOS_ANALISE.length);
    for(let i = 0; i < feitos; i++){
      const el = document.getElementById('an' + i);
      if(el && !el.classList.contains('done')){
        el.classList.add('done');
        el.querySelector('.ic').textContent = '✓';
      }
    }
    if(t < 1) requestAnimationFrame(passo);
    else setTimeout(() => go(1), 360);
  }
  requestAnimationFrame(passo);
}

/* =========================================================
   DIAGNÓSTICO
   A mesma função nas duas aparições:
   - curta (meio do quiz): entrega uma leitura real e cria a
     curiosidade pelo índice, sem mostrar o número ainda.
   - completa (full): o número, as metas calculadas e a virada.
   ========================================================= */
function renderDiagnostico(full){
  const nome = nomeDe();
  const v    = calcIndice();
  const f    = faixaIndice(v);
  const frac = elosFracos();
  const kcal = metaKcal();
  const pct  = full ? 100 : pctAte('proteina');

  /* ---- versão curta ---- */
  if(!full){
    /* atenção: aqui só valem respostas até a pergunta 10.
       tentativas e abandono ainda não foram feitas. */
    const ref = state.answers.refeicoes_i;
    const texto = ref === 1
      ? `Você disse que começa bem e desanda à noite. Isso não é falta de disciplina: é o que acontece com quase todo mundo que passa o dia decidindo cada refeição na hora. No fim do dia a decisão fica cara demais.`
      : ref === 0
        ? `Você disse que cada dia é de um jeito. E é exatamente aí que o resultado se perde: não no que você come num dia ruim, mas em nunca saber de antemão o que vem no próximo.`
        : `Você já segue mais ou menos uma linha. E mesmo assim o resultado não aparece do jeito que deveria. Isso quase nunca é sobre esforço.`;

    return app.innerHTML = `
    <div class="wrap fade">
      <div class="card-quiz">
        ${backBtn()}
        <div class="brand">${PRODUTO.nome}</div>
        <div class="brand-sub">Primeira leitura</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>

        <h2 class="q-title" style="font-size:22px">${nome ? nome + ', o' : 'O'} problema não é onde você acha que é</h2>

        <div class="ponto">
          <div class="n">O que já dá pra ver</div>
          <p>${texto}</p>
          <p>Ninguém engorda por não saber que refrigerante engorda. <b>O que derruba a maioria não é falta de informação, é falta de estrutura no dia comum</b>: o dia corrido, o dia cansado, o dia em que deu tudo errado.</p>
        </div>

        <div class="ponto">
          <div class="n">Por que isso importa pra você</div>
          <p>Com o que você já respondeu, dá pra calcular quanto o seu corpo precisa comer por dia e quanto ele está deixando de aproveitar do seu esforço.</p>
          <p><b>Faltam poucas perguntas</b> para fechar o seu ${PRODUTO.indice} e liberar os seus números.</p>
        </div>

        <button class="btn" onclick="go(1)">Continuar o teste →</button>
      </div>
    </div>`;
  }

  /* ---- versão completa ---- */
  const R = 78, C = 2 * Math.PI * R;
  const off = C * (1 - v/100);
  const dif = difPeso();
  const obj = objetivoId();
  const frase_obj = obj === 'hipertrofia'
    ? 'ganhar massa' : obj === 'manutencao' ? 'manter e definir' : 'emagrecer';

  const abandono = [
    'você desanima quando o resultado demora a aparecer',
    'você trava quando a rotina fica complicada demais',
    'um escorregão vira o fim da dieta inteira',
    'você fica sem saber se está fazendo certo',
    'você não tem ninguém acompanhando de perto'
  ][state.answers.abandono_i] || 'a rotina não se sustenta';

  app.innerHTML = `
  <div class="wrap fade">
    <div class="card-quiz">
      <div class="diag-tag">Seu diagnóstico</div>

      <div class="gauge">
        <svg width="190" height="190" viewBox="0 0 190 190">
          <circle class="trilho" cx="95" cy="95" r="${R}"/>
          <circle class="arco" cx="95" cy="95" r="${R}" stroke="${f.cor}"
                  stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" id="arco"/>
        </svg>
        <div class="gauge-centro">
          <div class="gauge-num" style="color:${f.cor}">${v}</div>
          <div class="gauge-lbl">de 100</div>
        </div>
      </div>
      <div class="faixa" style="color:${f.cor}">Constância ${f.nome}</div>
      <p class="faixa-sub">${nome ? nome + ', ' + f.txt.charAt(0).toLowerCase() + f.txt.slice(1) : f.txt}</p>

      ${v < 60 ? `
        <div class="alerta">
          <div class="t">⚠️ O seu esforço está vazando</div>
          <div class="s">Com esse índice, boa parte do que você faz nos dias bons é desfeita nos dias ruins. Não é o esforço que está faltando: é ele não estar chegando inteiro no fim da semana.</div>
        </div>` : ''}

      <h3 class="secao-tt" style="margin-top:22px">Os seus números</h3>
      <div class="numeros">
        <div class="num-box"><div class="v">${kcal}<small>kcal</small></div><div class="l">Sua meta por dia para ${frase_obj}</div></div>
        <div class="num-box"><div class="v">${metaProt()}<small>g</small></div><div class="l">De proteína por dia</div></div>
        <div class="num-box"><div class="v">${(metaAgua()/1000).toFixed(1).replace('.',',')}<small>L</small></div><div class="l">De água por dia</div></div>
        <div class="num-box"><div class="v">${imc().toString().replace('.',',')}</div><div class="l">Seu IMC hoje</div></div>
      </div>
      <p class="price-just" style="margin-bottom:20px">Calculado com <b>Mifflin-St Jeor</b> a partir do seu peso, altura, idade e objetivo. É o mesmo cálculo que o ${PRODUTO.nome} usa por dentro.</p>

      <h3 class="secao-tt">2 pontos que o teste identificou</h3>

      <div class="ponto">
        <div class="n">1 · Onde o seu resultado está vazando</div>
        <p>Os dois pontos que mais pesam contra você hoje são <b>${frac[0].rotulo}</b> e <b>${frac[1].rotulo}</b>. Não é que você não saiba disso. É que ninguém transformou isso em uma instrução do que fazer hoje, nesta refeição, neste treino.</p>
        <p>Somando tudo, o seu índice ficou em <b>${v} de 100</b>. Cada ponto aí é um dia em que o esforço não vira resultado.</p>
      </div>

      <div class="ponto">
        <div class="n">2 · Por que as outras vezes não foram pra frente</div>
        <p>Você disse que, quando para, é porque <b>${abandono}</b>. Guarde isso, porque é o ponto exato onde toda dieta que você tentou quebrou.</p>
        <p>Plano nenhum falha na semana 1. <b>Ele falha na semana 3</b>, quando a novidade passa e sobra só a rotina. É essa parte que quase nenhum plano resolve.</p>
      </div>

      ${dif > 0 ? `
        <div class="ponto" style="border-color:#F0DFB4;background:var(--ambar-tint)">
          <div class="n" style="color:#8A6100">O que você me disse que quer</div>
          <p>Sair de <b>${num('peso')} kg</b> e chegar em <b>${num('meta_peso')} kg</b>. São <b>${dif} kg</b> de diferença, e essa conta não muda por motivação: muda por quantos dias seguidos você consegue fazer o simples.</p>
        </div>` : ''}

      <button class="btn" style="margin-top:18px" onclick="go(1)">Ver o que fazer com isso →</button>
      <p style="font-size:11.5px;color:var(--cinza-c);text-align:center;margin-top:14px;line-height:1.6;font-weight:600">
        Este teste é orientativo e não substitui acompanhamento médico ou nutricional.
      </p>
    </div>
  </div>`;

  /* anima o arco depois de pintar a tela */
  requestAnimationFrame(() => {
    const arco = document.getElementById('arco');
    if(arco) arco.style.strokeDashoffset = off.toFixed(1);
  });
}

/* =========================================================
   MINI-VSLs
   Duas, com o mesmo expert:
   1) o mecanismo do PROBLEMA — por que sempre quebra
   2) o mecanismo da SOLUÇÃO — o que o app faz diferente
   Enquanto o vídeo não estiver pronto, o roteiro fica
   visível na tela e o funil roda mesmo assim. Para ligar o
   vídeo, troque o conteúdo de .video-box pelo embed.
   ========================================================= */
const VSLS = {
  1: {
    tag: 'Assista antes de continuar',
    pergunta: a => `${nomeDe() ? nomeDe() + ', por' : 'Por'} que você <span>já sabe o que fazer</span> e mesmo assim não faz?`,
    duracao: '2 min',
    roteiro: a => `
      <p>Deixa eu te falar uma coisa que ninguém fala: <strong>você não tem um problema de informação</strong>. Você sabe que precisa comer melhor, beber água, treinar e dormir. Todo mundo sabe.</p>
      <p>O que acontece é outra coisa. Toda dieta que você já fez foi desenhada para o seu dia bom. O dia em que deu tempo de cozinhar, em que você foi treinar, em que dormiu bem.</p>
      <p>Só que a sua semana não é feita de dias bons. Ela é feita de dia corrido, dia cansado, dia que a criança adoeceu, dia que a reunião passou da hora. <strong>É nesses dias que o plano quebra</strong>, e é neles que ninguém te dá instrução nenhuma.</p>
      <p>Aí o que sobra é você achando que o problema é a sua força de vontade. Não é. <strong>É que ninguém nunca te deu o que fazer no dia ruim.</strong></p>
      <p>Continue o teste, porque na próxima parte eu te mostro o número exato de como isso está te custando hoje.</p>`
  },
  2: {
    tag: 'A parte que resolve',
    pergunta: a => `O que muda quando <span>alguém decide por você</span> todo dia`,
    duracao: '3 min',
    roteiro: a => `
      <p>Olha o seu número de novo: <strong>${calcIndice()} de 100</strong>. Esse número não mede o seu esforço. Ele mede quantos dias da sua semana têm estrutura.</p>
      <p>E estrutura não é motivação. Motivação some. Estrutura é abrir o celular de manhã e já estar escrito: <strong>é isso que você come no café, é esse o seu treino de hoje, é essa a sua meta de água</strong>. Sem escolher, sem calcular, sem pensar.</p>
      <p>É por isso que quem tem nutricionista e personal costuma ir mais longe. Não é porque a pessoa sabe mais. É porque tem alguém decidindo por ela e olhando o que ela fez.</p>
      <p>O que eu montei foi exatamente isso, só que dentro do seu celular e por um preço que cabe: <strong>${PRODUTO.nome}</strong>. Ele pega os seus números, os mesmos que o teste acabou de calcular, e transforma em um dia de cada vez.</p>
      <p>Na próxima tela eu te mostro como ele funciona e o que você recebe.</p>`
  }
};

function renderVSL(n){
  const v = VSLS[n];
  app.innerHTML = `
  <div class="wrap fade">
    <div class="card-quiz">
      ${backBtn()}
      <span class="vsl-tag">${v.tag}</span>
      <h2 class="vsl-ask">${v.pergunta(state.answers)}</h2>
      <p class="vsl-quem">${EXPERT.nome} · ${EXPERT.credencial}</p>

      <div class="video-box" id="vslBox">
        <div class="play">▶</div>
        <div class="vlabel">Vídeo ${n} de 2 · ${v.duracao}</div>
        <div class="vname">${EXPERT.nome}</div>
        <div class="vhint">substitua esta caixa pelo embed do vídeo</div>
      </div>

      <div class="roteiro">
        <h4>O que ${EXPERT.nome.split(' ')[0]} explica neste vídeo</h4>
        ${v.roteiro(state.answers)}
      </div>

      <button class="btn" onclick="go(1)">${n === 1 ? 'Continuar o teste →' : 'Quero ver como funciona →'}</button>
    </div>
  </div>`;
}

/* =========================================================
   OFERTA — última tela do quiz, já é a página de venda
   ========================================================= */
const INCLUI = [
  ['🍽️','Cardápio calculado no seu número','As suas ' + '{KCAL}' + ' kcal viram café, almoço, lanches e jantar, com gramagem. Você marca o que comeu e vê quanto falta.'],
  ['🔁','Troca de alimento em um toque','Não gosta de ovo? Troca. O cardápio e a lista de compras se ajustam sozinhos, sem sair da meta.'],
  ['🗓️','Cardápio novo ao longo da semana','Três variações de cada refeição, girando por dia. Você não come a mesma coisa segunda e sábado.'],
  ['🛒','Lista de compras da semana pronta','Some tudo o que você vai comer nos 7 dias, já com as suas trocas. É só levar pro mercado.'],
  ['🏋️','Treino do seu sexo e do seu lugar','{LOCAL}. Divisão da semana, séries, repetições e descanso. Com cardio na dose do seu objetivo.'],
  ['📖','48 exercícios com execução explicada','Para você não fazer errado nem depender de vídeo aleatório.'],
  ['📈','Registro de carga e evolução','Anota o peso que você levantou e mostra se está subindo. É a prova de que está funcionando.'],
  ['💧','Metas de água e de sono','Calculadas pelo seu peso. Não é regra de internet, é a sua conta.'],
  ['🏆','Níveis e pontos','Cada coisa marcada vira ponto. São 10 níveis. É o que segura você nos dias em que a balança não mexe.'],
  ['☁️','Sua conta na nuvem','Troca de celular e continua de onde parou.']
];

const FAQS = [
  ['Preciso de academia?', 'Não. No teste você escolheu onde vai treinar e o app monta o plano em cima disso: se for em casa, o treino usa pouco ou nenhum equipamento.'],
  ['Vou passar fome?', 'Não é esse o desenho. A sua meta foi calculada pelo seu corpo, com proteína alta para segurar a fome, e o cardápio tem lanches e refeição livre.'],
  ['E se eu não gostar de algum alimento?', 'Cada alimento tem um botão de troca com outras opções. Você escolhe e o cardápio e a lista de compras se ajustam sozinhos, sem sair da meta.'],
  ['Funciona no meu celular?', 'Funciona em qualquer celular com internet, Android ou iPhone. Não precisa baixar nada na loja: abre no navegador e dá para deixar um atalho na tela inicial.'],
  ['É cobrado todo mês?', 'Não. O pagamento é uma vez só e o acesso continua seu.'],
  ['E se não for pra mim?', 'Você tem 7 dias para pedir o dinheiro de volta, sem precisar explicar nada.']
];

function renderOferta(){
  const nome = nomeDe();
  const v = calcIndice();
  const kcal = metaKcal();
  const localTxt = localId() === 'casa' ? 'Você escolheu treinar em casa' : 'Você escolheu treinar na academia';
  const dif = difPeso();

  app.innerHTML = `
  <div class="wrap fade">
    <div class="oferta">

      <div class="card-quiz" style="text-align:center">
        <div class="diag-tag">Seu plano está pronto</div>
        <h2 class="of-h">${nome ? nome + ', ' : ''}o seu teste virou <span>um plano de verdade</span></h2>
        <p class="of-sub">Tudo o que o diagnóstico calculou já está montado dentro do ${PRODUTO.nome}, esperando você entrar.</p>
        <div class="numeros" style="margin-bottom:0">
          <div class="num-box"><div class="v">${kcal}<small>kcal</small></div><div class="l">Sua meta diária</div></div>
          <div class="num-box"><div class="v">${metaProt()}<small>g</small></div><div class="l">De proteína</div></div>
          <div class="num-box"><div class="v">${(metaAgua()/1000).toFixed(1).replace('.',',')}<small>L</small></div><div class="l">De água</div></div>
          <div class="num-box"><div class="v">${v}<small>/100</small></div><div class="l">Seu índice hoje</div></div>
        </div>
      </div>

      <h3 class="secao-tt">O que tem dentro</h3>
      <div class="lista-check">
        ${INCLUI.map(([ic,t,s])=>`
          <div class="item-check">
            <div class="ic">${ic}</div>
            <div><div class="t">${t}</div><div class="s">${s.replace('{KCAL}', kcal).replace('{LOCAL}', localTxt)}</div></div>
          </div>`).join('')}
      </div>

      <h3 class="secao-tt">Quanto custa</h3>
      <div class="price-box">
        <div class="label">Acesso ao ${PRODUTO.nome}</div>
        <div class="de">De R$ ${PRECO.de}</div>
        <div class="val"><sup>R$</sup>${PRECO.por}<span style="font-size:26px">${PRECO.centavos}</span></div>
        <div class="por">pagamento único, sem mensalidade</div>
        <div class="off">Condição desta página</div>
      </div>
      <p class="price-just">Uma consulta de nutricionista custa mais do que isso e vale um dia. <b>Aqui o plano se ajusta sozinho todo dia</b>, com o seu número recalculado sempre que o seu peso muda.</p>

      <div style="height:18px"></div>
      <button class="btn" onclick="irParaCheckout()">Quero começar agora →</button>
      <p style="text-align:center;font-size:12px;color:var(--cinza-c);margin-top:12px;font-weight:600">🔒 Compra segura · acesso liberado na hora</p>

      <h3 class="secao-tt">Se não for pra você</h3>
      <div class="garantia">
        <div class="em">🛡️</div>
        <h4>7 dias de garantia</h4>
        <p>Entre, use, monte a sua semana. Se em 7 dias você achar que não é pra você, pede o dinheiro de volta e devolvemos. Sem formulário, sem pergunta.</p>
      </div>

      <h3 class="secao-tt">Perguntas que todo mundo faz</h3>
      <div>
        ${FAQS.map(([q,a],i)=>`
          <div class="faq-item" id="faq${i}">
            <button class="faq-q" onclick="toggleFaq(${i})"><span>${q}</span><span class="sinal">+</span></button>
            <div class="faq-a"><p>${a}</p></div>
          </div>`).join('')}
      </div>

      <div style="height:24px"></div>
      <button class="btn" onclick="irParaCheckout()">Começar meu plano →</button>

      ${dif > 0 ? `<p class="price-just" style="margin-top:16px">Você me disse que quer sair de ${num('peso')} kg e chegar em ${num('meta_peso')} kg. <b>O primeiro dia disso pode ser hoje.</b></p>` : ''}

      <p class="rodape">
        ${PRODUTO.nome} · material educativo de apoio.<br>
        Não substitui acompanhamento médico ou nutricional.<br>
        Resultados variam de pessoa para pessoa.
      </p>
    </div>
  </div>`;

  px('ViewContent', true);
}

function toggleFaq(i){
  const el = document.getElementById('faq' + i);
  if(el) el.classList.toggle('on');
}

/* =========================================================
   SAÍDA DO QUIZ
   Guarda as respostas antes de mandar pro checkout, para o
   cadastro do app já vir preenchido quando a pessoa entrar.
   ========================================================= */
function salvarParaOApp(){
  const d = {
    nome: nomeDe(),
    sexo: state.answers.sexo || '',
    idade: num('idade') || '',
    altura: num('altura') || '',
    peso: num('peso') || '',
    meta_peso: num('meta_peso') || '',
    objetivo: objetivoId(),
    local: localId(),
    em: new Date().toISOString()
  };
  try { localStorage.setItem(CHAVE_QUIZ, JSON.stringify(d)); } catch(e){}
}

function irParaCheckout(){
  salvarParaOApp();
  track('quiz_checkout', { indice: calcIndice(), objetivo: objetivoId() });
  px('InitiateCheckout', true);
  if(!CHECKOUT_URL){
    alert('Falta colar o link do checkout em CHECKOUT_URL, no topo do arquivo quiz.html.');
    return;
  }
  window.location.href = CHECKOUT_URL;
}

/* ===== inicia ===== */
render();
</script>
</body>
</html>
