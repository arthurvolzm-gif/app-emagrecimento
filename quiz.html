<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800;900&family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --verde:#2e7d5a;
  --verde-claro:#4caf82;
  --verde-suave:#e8f5ef;
  --verde-escuro:#1a4d38;
  --dourado:#c8973a;
  --dourado-claro:#f5d99a;
  --creme:#fdf9f3;
  --cinza:#4a4a4a;
  --cinza-claro:#f5f5f5;
  --branco:#ffffff;
  --vermelho:#c0574f;
}

html{scroll-behavior:smooth;}

body{
  font-family:'Lato',sans-serif;
  background-color:#f3f8f5;
  background-image:url('bg-vegetal.jpg');
  background-attachment:fixed;
  background-size:cover;
  background-position:center;
  color:var(--cinza);
  line-height:1.6;
  min-height:100vh;
}

/* ===== BARRA TOPO ===== */
.topbar{
  background:var(--verde-escuro);
  color:#fff;
  text-align:center;
  padding:12px 16px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.3px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
}
.topbar span{opacity:.9;}

/* ===== WRAP ===== */
.wrap{
  max-width:620px;
  margin:0 auto;
  padding:28px 20px 80px;
}

.card-quiz{
  background:rgba(250,249,240,.96);
  border-radius:22px;
  box-shadow:0 12px 50px rgba(26,77,56,.14);
  padding:34px 30px;
  backdrop-filter:blur(2px);
  position:relative;
}

/* seta de voltar */
.back-btn{position:absolute;left:16px;top:14px;background:none;border:none;color:#9aaaa2;font-size:24px;line-height:1;cursor:pointer;padding:4px 8px;z-index:5;transition:color .18s;}
.back-btn:hover{color:var(--verde);}

.brand{text-align:center;margin-bottom:6px;}
.brand-nome{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--verde-escuro);}
.brand-logo{height:54px;display:block;margin:0 auto;}
.brand-sub{font-size:13px;color:#8aa79a;margin-bottom:20px;text-align:center;}

/* ===== PROGRESSO ===== */
.progress-head{display:flex;justify-content:flex-end;font-size:13px;color:var(--dourado);font-weight:700;margin-bottom:8px;}
.progress-bar{height:7px;background:#e3ede8;border-radius:20px;overflow:hidden;margin-bottom:26px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--verde-escuro),var(--verde-claro));border-radius:20px;transition:width .5s ease;}

/* ===== PILLS ===== */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.pill{background:#f0f7f3;border:1px solid #d9ebe2;color:var(--verde);font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;}

/* ===== INSIGHT BOX ===== */
.insight{background:#eef7f1;border-left:4px solid var(--verde-claro);border-radius:8px;padding:14px 16px;font-size:14px;color:#3a5a4c;line-height:1.6;margin-bottom:20px;}
.insight strong{color:var(--verde);}

.echo{font-size:14px;color:#7d9488;margin-bottom:6px;}

/* ===== PERGUNTA ===== */
.q-title{font-family:'Open Sans',sans-serif;font-size:26px;font-weight:900;color:var(--verde-escuro);line-height:1.25;margin-bottom:22px;text-align:center;}

/* ===== OPÇÕES ===== */
.opts{display:flex;flex-direction:column;gap:12px;}
/* variação compacta (perguntas com muitas opções, ex.: múltipla escolha) */
.opts.compact{gap:9px;}
.opts.compact .opt{padding:13px 16px;font-size:14.5px;}
.opts.compact .opt-radio{width:22px;height:22px;}
.q-title.tight{margin-bottom:12px;}
/* variação em grade: 2 opções por linha (abertura do quiz) */
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
/* card = foto colada ao botão, os dois arredondados juntos como uma peça só */
.opts.grid2 .idade-card{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(46,125,90,.28);transition:all .18s ease;cursor:pointer;}
.opts.grid2 .idade-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(46,125,90,.38);}
.opts.grid2 .idade-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
.opts.grid2 .opt{
  padding:15px 14px;font-size:14px;font-weight:500;justify-content:center;text-align:center;gap:10px;
  background:linear-gradient(135deg,#27ae60,var(--verde-claro));color:#fff;border-color:transparent;
  border-radius:0;margin:0;
}
.opts.grid2 .opt:hover{transform:none;box-shadow:none;border-color:transparent;}
.opts.grid2 .opt.sel{background:linear-gradient(135deg,#1a4d38,#2e7d5a);border-color:transparent;color:#fff;}
.opts.grid2 .opt-radio{width:20px;height:20px;border-color:rgba(255,255,255,.85);background:rgba(255,255,255,.16);}
.opts.grid2 .opt.sel .opt-radio{border-color:#fff;background:#fff;}
.opts.grid2 .opt.sel .opt-radio::after{color:var(--verde-escuro);font-size:12px;}
.opts.grid2 .idade-card:last-child:nth-child(odd){grid-column:1 / -1;justify-self:center;width:calc(50% - 5px);}
.opt{
  display:flex;align-items:center;gap:14px;
  background:#fff;border:1.5px solid #e2ece7;border-radius:14px;
  padding:17px 18px;font-size:15px;font-weight:600;color:var(--cinza);
  cursor:pointer;transition:all .18s ease;text-align:left;
}
.opt:hover{border-color:var(--verde-claro);box-shadow:0 6px 20px rgba(76,175,130,.12);transform:translateY(-1px);}
.opt-radio{width:24px;height:24px;border-radius:50%;border:2px solid #cdddd4;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .18s ease;}
.opt.sel{border-color:var(--verde);background:var(--verde-suave);}
.opt.sel .opt-radio{border-color:var(--verde);background:var(--verde);}
.opt.sel .opt-radio::after{content:'✓';color:#fff;font-size:13px;font-weight:700;}

/* variação com foto colada à esquerda de cada opção (lista vertical) */
.opts.photo .opt-row{display:flex;align-items:stretch;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.06);cursor:pointer;transition:all .18s ease;}
.opts.photo .opt-row:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(76,175,130,.18);}
.opts.photo .opt-row-img{width:84px;flex-shrink:0;object-fit:cover;display:block;}
.opts.photo .opt-row .opt{flex:1;border:none;border-radius:0;box-shadow:none;}
.opts.photo .opt-row .opt:hover{transform:none;box-shadow:none;border-color:transparent;}

/* ===== BOTÕES ===== */
.btn{
  display:block;width:100%;text-align:center;
  background:linear-gradient(135deg,#27ae60,var(--verde-claro));
  color:#fff;font-family:'Lato',sans-serif;font-size:17px;font-weight:900;
  border:none;border-radius:50px;padding:18px 28px;cursor:pointer;text-decoration:none;
  box-shadow:0 8px 30px rgba(46,125,90,.32);transition:transform .2s,box-shadow .2s;letter-spacing:.3px;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(46,125,90,.45);}
.btn-ghost{background:#fff;color:var(--verde);border:1.5px solid #d9ebe2;box-shadow:none;margin-top:12px;}
.btn-ghost:hover{background:#f4faf7;box-shadow:none;}

/* ===== INPUT DE TEXTO (nome) ===== */
.text-input{width:100%;border:1.5px solid #e2ece7;border-radius:14px;padding:16px 18px;font-size:16px;font-family:'Lato',sans-serif;color:var(--cinza);background:#fff;margin-bottom:14px;outline:none;transition:border-color .18s,box-shadow .18s;}
.text-input:focus{border-color:var(--verde);box-shadow:0 6px 20px rgba(76,175,130,.12);}
.text-input::placeholder{color:#b7c6bf;}

/* ===== RÉGUA (peso / altura) ===== */
.ruler-sub{font-size:14px;color:#7d9488;margin:-8px 0 18px;}
.unit-toggle{display:inline-flex;background:#e3ede8;border-radius:30px;padding:4px;margin-bottom:6px;}
.unit-toggle .ut{border:none;background:transparent;color:#7d9488;font-weight:800;font-size:14px;padding:8px 26px;border-radius:24px;cursor:pointer;transition:all .18s;}
.unit-toggle .ut.active{background:var(--verde);color:#fff;box-shadow:0 4px 14px rgba(46,125,90,.3);}
.ruler-val{font-family:'Playfair Display',serif;font-size:46px;font-weight:900;color:var(--verde-escuro);margin:16px 0 6px;line-height:1;}
.ruler-val small{font-size:20px;color:var(--verde);margin-left:3px;font-weight:700;}
.ruler-track{position:relative;height:52px;margin:6px 6px 0;}
.ruler-line{position:absolute;left:0;right:0;bottom:16px;height:2px;background:#e2ece7;}
.ruler-ticks{position:absolute;left:0;right:0;bottom:16px;height:26px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;}
.ruler-ticks .tk{width:1px;height:12px;background:#cdddd4;}
.ruler-ticks .tk.maj{height:24px;width:2px;background:#9bb3a8;}
.ruler-pointer{position:absolute;top:0;bottom:16px;width:3px;background:var(--verde);transform:translateX(-50%);pointer-events:none;border-radius:2px;transition:left .05s linear;}
.ruler-pointer::after{content:'';position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--verde);}
.ruler-input{position:absolute;left:0;right:0;top:0;width:100%;height:100%;margin:0;opacity:0;cursor:grab;z-index:5;-webkit-appearance:none;appearance:none;background:transparent;}
.ruler-input:active{cursor:grabbing;}
.ruler-input::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:52px;background:transparent;cursor:grab;}
.ruler-input::-moz-range-thumb{width:40px;height:52px;border:none;background:transparent;cursor:grab;}
.ruler-labels{display:flex;justify-content:space-between;font-size:13px;color:#9aaaa2;font-weight:700;margin-top:6px;}

/* ===== INTRO ===== */
.intro-badge{display:inline-block;background:var(--verde-suave);color:var(--verde);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:7px 18px;border-radius:20px;margin-bottom:22px;}
.intro-h1{font-family:'Open Sans',sans-serif;font-size:32px;font-weight:900;color:var(--verde-escuro);line-height:1.25;margin-bottom:16px;text-align:center;}
.intro-h1 span{color:var(--verde-claro);}
.intro-sub{font-size:16px;color:#5f6f68;text-align:center;line-height:1.65;margin-bottom:26px;}
.intro-secure{text-align:center;font-size:12px;color:#98a89f;margin-top:12px;}

/* ===== INTERSTICIAL ===== */
.inter-badge{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.inter-badge .ic{width:38px;height:38px;border-radius:50%;background:var(--verde-escuro);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.inter-badge .tt{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--verde-escuro);line-height:1.3;}
.inter-text{font-size:16px;color:#4a5c53;line-height:1.7;margin-bottom:14px;}
.inter-text strong{color:var(--verde);}
.inter-text .red{color:var(--vermelho);font-weight:700;}
.inter-mini{font-size:13px;color:#9aaaa2;margin-bottom:22px;}

/* ===== ANALISANDO ===== */
.analise-title{text-align:center;font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--verde-escuro);margin-bottom:26px;}
.analise-list{display:flex;flex-direction:column;gap:16px;}
.analise-item{display:flex;align-items:center;gap:14px;font-size:15px;color:#9aaaa2;font-weight:600;opacity:.5;transition:all .4s ease;}
.analise-item .ic{width:28px;height:28px;border-radius:50%;border:2px solid #d5e2db;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
.analise-item.done{opacity:1;color:var(--verde-escuro);}
.analise-item.done .ic{background:var(--verde-escuro);border-color:var(--verde-escuro);color:#fff;}

/* ===== HISTÓRIA ===== */
.hist-avatar{width:82px;height:82px;border-radius:50%;margin:0 auto 12px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.12);}
.hist-avatar img{width:100%;height:100%;object-fit:cover;}
.hist-tagline{font-family:'Playfair Display',serif;font-style:italic;font-size:17px;color:var(--verde-escuro);text-align:center;margin-bottom:14px;line-height:1.4;}
.hist-tag{display:block;width:max-content;margin:0 auto 10px;background:var(--verde-escuro);color:#fff;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:5px 14px;border-radius:20px;}
.hist-nome{text-align:center;font-weight:900;font-size:16px;color:var(--cinza);}
.hist-info{text-align:center;font-size:13px;color:#9aaaa2;margin-bottom:6px;}
.hist-stars{text-align:center;color:#f5a623;font-size:16px;letter-spacing:2px;margin-bottom:16px;}
.hist-quote{font-size:14.5px;color:#556a60;line-height:1.7;font-style:italic;text-align:center;margin-bottom:18px;}
.hist-result{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--verde);color:#fff;border-radius:12px;padding:14px 18px;font-size:14px;font-weight:700;line-height:1.4;margin-bottom:22px;}
.hist-result .ic{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.hist-pergunta{text-align:center;font-weight:700;color:var(--cinza);margin-bottom:14px;}

/* ===== MINI-VSL / VÍDEO PLACEHOLDER ===== */
.vsl-tag{display:block;width:max-content;margin:0 auto 14px;background:#fdecec;color:var(--vermelho);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:6px 16px;border-radius:20px;}
.vsl-ask{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--verde-escuro);text-align:center;line-height:1.3;margin-bottom:20px;}
.vsl-ask span{color:var(--verde-claro);}
.video-box{position:relative;border-radius:16px;overflow:hidden;margin-bottom:18px;background:linear-gradient(135deg,var(--verde-suave),#d6ede1);border:1px solid #d9ebe2;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
.video-box .play{width:66px;height:66px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:14px;box-shadow:0 8px 30px rgba(46,125,90,.4);animation:pulse 2.2s ease-in-out infinite;}
.video-box .vlabel{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--verde);}
.video-box .vname{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--verde-escuro);margin-top:6px;}
.video-box .vhint{font-size:11px;color:#9aaaa2;margin-top:8px;font-style:italic;}

/* roteiro visível (substitui o vídeo por enquanto) */
.roteiro{background:#f4faf7;border:1px solid #d9ebe2;border-radius:14px;padding:20px;margin-bottom:20px;}
.roteiro h4{font-family:'Lato',sans-serif;font-size:14px;color:var(--verde);margin-bottom:12px;letter-spacing:.3px;font-weight:900;}
.roteiro p{font-size:14.5px;color:#556a60;line-height:1.7;margin-bottom:12px;}
.roteiro p:last-child{margin-bottom:0;}
.roteiro strong{color:var(--verde-escuro);}
.roteiro .red{color:var(--vermelho);font-weight:700;}

/* ===== PRÉ-PITCH (antes x depois) ===== */
.pp-h{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;color:var(--verde-escuro);text-align:center;line-height:1.3;margin-bottom:8px;}
.pp-h span{color:var(--verde-claro);}
.pp-sub{text-align:center;font-size:14px;color:#7d9488;margin-bottom:24px;}

/* antes/depois */
.ad-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.res-ad-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ad-col{background:#fff;border-radius:14px;padding:20px;border:1px solid #e4ede9;}
.ad-col.antes{border-top:3px solid #e07a7a;}
.ad-col.depois{border-top:3px solid var(--verde-claro);}
.ad-col h4{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;color:var(--cinza);}
.ad-col.antes h4{color:var(--vermelho);}
.ad-col.depois h4{color:var(--verde);}
.ad-col li{list-style:none;font-size:13px;color:#66756f;padding:6px 0;display:flex;gap:8px;align-items:flex-start;line-height:1.5;}
.ad-col.antes li::before{content:'✕';color:#e07a7a;font-weight:800;flex-shrink:0;}
.ad-col.depois li::before{content:'✓';color:var(--verde-claro);font-weight:800;flex-shrink:0;}
.ad-note{text-align:center;font-size:12px;color:#a8b8b1;margin-top:14px;font-style:italic;}

/* ===== OFERTA REVELAR ===== */
.rev-badge{display:block;width:max-content;margin:0 auto 16px;background:var(--verde-escuro);color:#fff;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:6px 16px;border-radius:20px;}
.rev-lead{text-align:center;font-size:15px;color:#4a5c53;line-height:1.65;margin-bottom:22px;}
.rev-lead strong{color:var(--verde-escuro);}
.rev-tap{background:linear-gradient(135deg,var(--verde),var(--verde-claro));border-radius:16px;padding:26px 20px;text-align:center;color:#fff;cursor:pointer;box-shadow:0 10px 34px rgba(46,125,90,.32);transition:transform .2s;margin-bottom:18px;animation:pulse 2.4s ease-in-out infinite;}
.rev-tap:hover{transform:translateY(-2px);}
.rev-tap .big{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;line-height:1.3;}
.rev-tap .small{font-size:13px;opacity:.9;margin-top:6px;}
@keyframes pulse{0%,100%{box-shadow:0 10px 34px rgba(46,125,90,.32);}50%{box-shadow:0 14px 44px rgba(46,125,90,.55);}}

.reserva{display:flex;align-items:center;justify-content:center;gap:10px;background:#f0f7f3;border-radius:12px;padding:12px;font-size:14px;color:var(--verde-escuro);font-weight:700;margin-bottom:20px;}
.reserva .t{font-variant-numeric:tabular-nums;}
.rev-secure{text-align:center;font-size:12px;color:#a8b8b1;margin-top:16px;}

/* ===== PREÇO ===== */
.price-box{background:linear-gradient(150deg,var(--verde-escuro),var(--verde));border-radius:18px;padding:28px 24px;text-align:center;color:#fff;margin-bottom:18px;}
.price-box .label{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;}
.price-box .val{font-family:'Playfair Display',serif;font-size:56px;font-weight:900;line-height:1;margin:6px 0;}
.price-box .val sup{font-size:24px;}
.price-box .de{font-size:14px;opacity:.75;text-decoration:line-through;}
.price-box .off{display:inline-block;background:var(--verde-claro);color:#fff;font-size:12px;font-weight:800;padding:4px 14px;border-radius:20px;margin-top:10px;letter-spacing:.5px;}
.price-just{font-size:13px;color:#7d9488;line-height:1.6;text-align:center;margin-bottom:18px;}
.price-just strong{color:var(--verde);}

/* ===== TOAST ===== */

/* =========================================================
   MEDIÇÃO DO FUNIL DO QUIZ
   Manda o mesmo evento para o GA4 e para o Pixel. Serve para
   responder duas perguntas: em que etapa a pessoa parou e qual
   resposta cada pergunta mais recebeu.
   ========================================================= */
function track(evento, params){
  try{ if(typeof gtag==='function') gtag('event', evento, params||{}); }catch(e){}
  try{ if(typeof fbq==='function') fbq('trackCustom', evento, params||{}); }catch(e){}
}

/* estado da medição: guarda a etapa mais avançada que a pessoa viu */
const track_estado = { etapa:0, rotulo:'intro', concluiu:false, respondidas:0 };

function trackEtapa(step){
  let num = 0, rotulo = step.type;
  if(step.type==='question'){ num = step.q.num; rotulo = step.q.id; }
  else if(step.type==='intro'){ num = 0; rotulo = 'intro_idade'; }
  else { num = track_estado.etapa; }                 /* telas de conteúdo herdam o número da última pergunta */

  track_estado.etapa  = Math.max(track_estado.etapa, num);
  track_estado.rotulo = rotulo;
  if(step.type==='result') track_estado.concluiu = true;

  track('quiz_etapa', {
    etapa: num,
    etapa_id: rotulo,
    tipo: step.type,
    posicao: state.idx,
    total_perguntas: TOTAL_Q
  });
}

function trackResposta(qid, valor){
  track_estado.respondidas++;
  const q = QUESTIONS.find(x=>x.id===qid);
  track('quiz_resposta', {
    pergunta: qid,
    etapa: q ? q.num : 0,
    resposta: Array.isArray(valor) ? valor.join(' | ') : String(valor)
  });
}

/* abandono: quem fecha a página antes da tela final marca a última etapa vista */
window.addEventListener('pagehide', function(){
  if(track_estado.concluiu) return;
  track('quiz_abandono', {
    etapa: track_estado.etapa,
    etapa_id: track_estado.rotulo,
    respondidas: track_estado.respondidas
  });
});

/* =========================================================
   ESTADO E FLUXO
   ========================================================= */
const state = { idx:0, answers:{} };
const FLOW = [];
/* o array QUESTIONS já está na ordem de execução (veja o comentário lá em
   cima) — o forEach só decide ONDE, entre uma pergunta e outra, entra uma
   tela de conteúdo (diagnóstico, análise, a tela do app). */
FLOW.push({type:'intro'});
FLOW.push({type:'idade'});
QUESTIONS.forEach(q=>{
  FLOW.push({type:'question', q});
  if(q.id==='altura'){                                      // diagnóstico curto, ainda sem números
    FLOW.push({type:'diagnostico'});
  }
  if(q.id==='tempo_disponivel'){                             // análise + diagnóstico completo (índice + calorias reais)
    FLOW.push({type:'analyzing'});
    FLOW.push({type:'diagnostico', full:true});
  }
  if(q.id==='medo'){                                         // tela do app, estilo "isso ajudaria você?"
    FLOW.push({type:'appTeaser'});
  }
});
FLOW.push({type:'analyzing', v2:true});                     // 3ª vez: analisa tudo, inclusive outros_objetivos
FLOW.push({type:'projecao'});                               // projeção final — já é a página de entrada no app, última tela do quiz

const app = document.getElementById('app');
const TOTAL_Q = QUESTIONS.length;

function go(n){ state.idx += n; render(); window.scrollTo({top:0,behavior:'instant'}); }
/* percentual da barra nas telas de conteúdo: usa a última pergunta respondida antes dela */
function pctAte(qid){ const q = QUESTIONS.find(x=>x.id===qid); return q ? Math.round((q.num/TOTAL_Q)*100) : 100; }
function esc(s){return (s||'').replace(/"/g,'&quot;');}
function backBtn(){ return state.idx>0 ? `<button class="back-btn" onclick="go(-1)" aria-label="Voltar">←</button>` : ''; }

function pillsHTML(uptoNum){
  const done = QUESTIONS.filter(q=>q.num<uptoNum && state.answers[q.id] && !q.noPill);
  if(!done.length) return '';
  return `<div class="pills">${done.slice(-4).map(q=>`<span class="pill">${state.answers[q.id]}</span>`).join('')}</div>`;
}

const TOASTS = {};
function toastHTML(count){
  const txt = count===1
    ? `<b>+1 pessoa</b> está fazendo o diagnóstico junto com você`
    : `<b>+${count} pessoas</b> estão fazendo o diagnóstico junto com você`;
  return `<div class="toast" id="toast"><span class="ic">🔥</span><span>${txt}</span><button class="x" onclick="document.getElementById('toast').remove()">×</button></div>`;
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const step = FLOW[state.idx];
  const map = {
    intro:renderIntro, idade:renderIdade, question:()=>renderQuestion(step.q), break1:renderBreak1,
    interstitial:()=>renderInterstitial(step.id),
    analyzing:()=>renderAnalyzing(step.v2), diagnostico:()=>renderDiagnostico(step.full), prepitch:renderPrePitch, meta:renderMeta,
    appTeaser:renderAppTeaser,
    projecao:renderProjecao,
    offerLocked:renderOfferLocked, offerPrice:renderOfferPrice, result:renderResult
  };
  (map[step.type]||renderIntro)();
  trackEtapa(step);
}

  let uIdx=0;
  const rangeEl=document.getElementById('rRange');
  const valEl=document.getElementById('rVal');
  const unitEl=document.getElementById('rUnit');
  const pointer=document.getElementById('rPointer');
  const labels=document.getElementById('rLabels');
  let t=''; for(let i=0;i<=40;i++) t+=`<span class="tk${i%5===0?' maj':''}"></span>`;
  document.getElementById('rTicks').innerHTML=t;
  function setLabels(c){ labels.innerHTML=`<span>${c.min}</span><span>${Math.round((c.min+c.max)/2)}</span><span>${c.max}</span>`; }
  function update(){
    const c=q.units[uIdx], v=parseFloat(rangeEl.value);
    valEl.textContent=Math.round(v);
    pointer.style.left=(((v-c.min)/(c.max-c.min))*100)+'%';
  }
  rangeEl.addEventListener('input',update);
  document.querySelectorAll('#uToggle .ut').forEach(b=>{
    b.onclick=()=>{
      const ni=parseInt(b.dataset.i,10); if(ni===uIdx) return;
      const cur=parseFloat(rangeEl.value), to=q.units[ni];
      let conv;
      if(q.id==='peso') conv = (to.u==='lb') ? cur*2.2046 : cur/2.2046;
      else conv = (to.u==='pol') ? cur/2.54 : cur*2.54;
      uIdx=ni;
      document.querySelectorAll('#uToggle .ut').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      rangeEl.min=to.min; rangeEl.max=to.max; rangeEl.step=to.step;
      rangeEl.value=Math.min(to.max,Math.max(to.min,Math.round(conv)));
      unitEl.textContent=to.u; setLabels(to); update();
    };
  });
  setLabels(u0); update();
  document.getElementById('rNext').onclick=()=>{ state.answers[q.id]=Math.round(parseFloat(rangeEl.value))+' '+q.units[uIdx].u; trackResposta(q.id, state.answers[q.id]); go(1); };
}

function renderAnalyzing(v2){
  app.innerHTML = `
  <div class="wrap fade">
    <div class="card-quiz" style="padding-top:56px;padding-bottom:52px;">
      ${v2 ? '' : '<div class="brand-sub" style="margin-bottom:14px;">Diagnóstico personalizado</div>'}

      <div class="lib-box" style="margin-top:30px;">
        ${v2 ? '<div class="lib-label" style="margin-bottom:6px;">Calculando o seu Índice de Constância...</div>' : ''}
        <div class="lib-label">${v2 ? 'Identificando a solução para seu caso...' : 'Liberando seu diagnóstico personalizado...'}</div>
        <div class="lib-pct" id="libPct">0%</div>
        <div class="lib-bar"><div class="lib-fill" id="libFill"></div></div>
      </div>
    </div>
  </div>`;
  const DUR = 5000;                                    // total da animação
  const pctEl=document.getElementById('libPct'), fillEl=document.getElementById('libFill');
  const startT=performance.now();
  let ultimo = -1;                                     // só repinta o número quando o inteiro muda
  function tick(now){
    const t=Math.min(1,(now-startT)/DUR);
    const eased=t*t*t*(t*(t*6-15)+10);                 // smootherstep: parte e chega sem solavanco
    const pct=Math.round(eased*100);
    if(pctEl && pct!==ultimo){ pctEl.textContent=pct+'%'; ultimo=pct; }
    if(fillEl)fillEl.style.width=(eased*100)+'%';
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  setTimeout(()=>go(1),DUR);
}


/* ---------- CÁLCULOS ----------
   As metas de caloria, proteína e água usam as MESMAS fórmulas do app
   (veja js/store.js: calcMetaKcal/calcMetaAgua/calcMetaProt). Se mudar a
   fórmula lá, mude aqui também, senão o número do quiz não bate com o
   que a pessoa vai ver depois dentro do app. */

function numDe(id){
  return parseFloat(String(state.answers[id]||'').replace(',','.')) || 0;
}

function objetivoId(){
  const o = state.answers.objetivo || '';
  if(o.includes('Ganhar massa')) return 'hipertrofia';
  if(o.includes('Manter'))       return 'manutencao';
  return 'emagrecimento';
}

/* a idade vem por faixa (cartão com foto), não por número exato — a régua
   de idade fica mais bonita e converte melhor, mas Mifflin-St Jeor precisa
   de um número. Uso o meio de cada faixa: é uma estimativa, por isso o
   texto do diagnóstico sempre fala em "estimativa a partir da sua faixa
   etária", nunca finge ser exato. */
const IDADE_MEIO = { 'Entre 18 e 29 anos':24, 'Entre 30 e 39 anos':35, 'Entre 40 e 49 anos':45, '+50 anos':55 };
function idadeAprox(){ return IDADE_MEIO[state.answers.idade] || 30; }

function calcIMC(){
  const pesoStr = state.answers.peso || '';
  const altStr  = state.answers.altura || '';
  const p = parseFloat(pesoStr), a = parseFloat(altStr);
  if(!p || !a) return null;
  let kg = /lb/i.test(pesoStr) ? p/2.2046 : p;               // lb -> kg
  let m  = /pol/i.test(altStr) ? (a*2.54)/100 : a/100;        // pol/cm -> metros
  if(!m) return null;
  return kg/(m*m);
}

function metaKcal(){
  const peso = numDe('peso'), altura = numDe('altura'), idade = idadeAprox();
  if(!peso || !altura) return 0;
  const base = 10*peso + 6.25*altura - 5*idade;
  const tmb  = state.answers.sexo === 'Homem' ? base + 5 : base - 161;
  const fator = objetivoId()==='emagrecimento' ? 0.80 : objetivoId()==='hipertrofia' ? 1.12 : 1.00;
  return Math.round(tmb * 1.45 * fator / 10) * 10;
}
function metaAgua(){
  const bruto = numDe('peso') * 35;
  return Math.max(1500, Math.min(4500, Math.round(bruto/500)*500));
}
function metaProt(){
  const gkg = objetivoId()==='emagrecimento' ? 2.0 : objetivoId()==='hipertrofia' ? 1.8 : 1.6;
  return Math.round(numDe('peso') * gkg);
}
function difPeso(){ return +(numDe('peso') - numDe('meta_peso')).toFixed(1); }

/* ===== ÍNDICE DE CONSTÂNCIA (0 a 100) =====
   Não é exame nem promessa de resultado: é a soma do que a própria pessoa
   respondeu sobre a rotina dela hoje (treino, alimentação, sono, água e
   histórico de tentativas). Nenhum número aqui é inventado — é só a rotina
   dela devolvida como nota. Por isso dá pra mostrar o cálculo sem medo. */
const PESOS_INDICE = {
  treino_frequencia: [0, 12, 22, 30],   // nenhuma / 1-2x / 3-4x / 5x+           (30)
  alimentacao:       [0,  8, 17, 25],   // sem rotina / desanda / mais ou menos / organizada (25)
  sono:              [0,  8, 20, 17],   // <5h / 5-6h / 7-8h (ótimo) / >8h       (20)
  agua:              [0,  8, 15],       // <1L / 1-2L / >2L                     (15)
  tentativas:        [4,  2, 10,  0]    // perdeu e voltou / não manteve / 1ª vez / já tentou tudo (10)
};
const INDICE_MAX = 100;

function calcIndiceConstancia(){
  let soma = 0;
  for(const id in PESOS_INDICE){
    const i = state.answers[id+'_i'];
    if(typeof i === 'number') soma += (PESOS_INDICE[id][i] || 0);
  }
  return Math.max(0, Math.min(100, Math.round(soma)));
}

function faixaIndice(v){
  if(v < 35) return { txt:'BAIXA',  cor:'#c0574f', bg:'#fdecec' };
  if(v < 65) return { txt:'MÉDIA',  cor:'#c8973a', bg:'#fff8e8' };
  return       { txt:'BOA',   cor:'#2e7d5a', bg:'#e9f6ee' };
}

/* o ponto fraco que mais pesa hoje, pra personalizar o diagnóstico completo */
function elosFracos(){
  const rotulo = { treino_frequencia:'o treino', alimentacao:'a alimentação', sono:'o sono', agua:'a água', tentativas:'a constância' };
  return Object.keys(PESOS_INDICE).map(id=>{
    const i = state.answers[id+'_i'];
    const max = Math.max(...PESOS_INDICE[id]);
    const val = typeof i === 'number' ? (PESOS_INDICE[id][i]||0) : 0;
    return { id, rotulo: rotulo[id], perdido: max-val };
  }).sort((a,b)=>b.perdido-a.perdido);
}

/* cronômetro no cabeçalho — regressivo até a meia-noite de hoje */
function startMidnightCountdown(){
  const el=document.getElementById('midnight-timer'); if(!el) return;
  const t=setInterval(()=>{
    if(!document.body.contains(el)){clearInterval(t);return;}  // some outra tela: para o contador
    const now=new Date();
    const end=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59,999);
    let diff=Math.max(0,Math.floor((end-now)/1000));
    const h=String(Math.floor(diff/3600)).padStart(2,'0');
    const m=String(Math.floor((diff%3600)/60)).padStart(2,'0');
    const s=String(diff%60).padStart(2,'0');
    el.textContent=`${h}:${m}:${s}`;
  },1000);
  // primeiro update imediato
  const now=new Date();
  const end=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59,59,999);
  let diff=Math.max(0,Math.floor((end-now)/1000));
  el.textContent=`${String(Math.floor(diff/3600)).padStart(2,'0')}:${String(Math.floor((diff%3600)/60)).padStart(2,'0')}:${String(diff%60).padStart(2,'0')}`;
}
